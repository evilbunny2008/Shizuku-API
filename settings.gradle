pluginManagement {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id "com.android.settings" version '9.4.0'
}

android {
    compileSdk = 37
    minSdk = 29
    targetSdk = 37
    ndkVersion = "29.0.14206865"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

include ":aidl", ":api", ":provider", ":rish", ":server-shared", ":shared"
includeBuild "example"